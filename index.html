<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capability Radar · prototype</title>
<meta name="description" content="Capability Radar concept prototype: a single source of truth for digital features, teams and points of contact. Sample data only.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22' fill='%233A4FD6'/%3E%3Cpath d='M24 24L24 2A22 22 0 0 1 39.6 8.4Z' fill='%233DDC97' fill-opacity='.5'/%3E%3Ccircle cx='31' cy='12.5' r='3' fill='%233DDC97'/%3E%3Ccircle cx='24' cy='24' r='3' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Serif:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#F4F5F7}
.app{--bg:#F4F5F7;--surface:#FFFFFF;--surface-2:#FAFBFC;--line:#E1E4EA;--line-strong:#C9CEDB;--ink:#15192B;--ink-2:#3A4052;--muted:#5A6072;--chip:#EEF0F4;--accent-soft:#EEF2FD;--accent-ink:#163A9C;--link:#1F4FD1;--good:#1E6B45;--bad:#8A2E0E;--chrome:#15192B;color-scheme:light}
.app.dark{--bg:#0E111C;--surface:#171B2A;--surface-2:#1C2133;--line:#2B3147;--line-strong:#3F4763;--ink:#E9ECF4;--ink-2:#C6CBD9;--muted:#A0A8BD;--chip:#232942;--accent-soft:#1E2A52;--accent-ink:#B3C5FF;--link:#93ADFF;--good:#5FD69E;--bad:#FF8F80;--chrome:#080A12;color-scheme:dark}
.app{--grad-primary:linear-gradient(135deg,#1F4FD1 0%,#4A3FD3 60%,#6A4BD6 100%);--grad-chrome:linear-gradient(115deg,#0F1330 0%,#16245E 55%,#2E2470 100%);--grad-soft:linear-gradient(135deg,rgba(31,79,209,.10) 0%,rgba(14,143,128,.08) 100%);--grad-ink:linear-gradient(135deg,#15192B 0%,#2A3366 100%);--page-bg:radial-gradient(900px 420px at 8% -8%,rgba(31,79,209,.10),transparent 70%),radial-gradient(800px 380px at 100% 0%,rgba(106,75,214,.08),transparent 70%),#F4F5F7;--c-blue:#1F4FD1;--c-teal:#0E8F80;--c-violet:#6A4BD6;--c-amber:#C27C0E;--c-coral:#D2533F;--c-rose:#C2417A;--c-slate:#5B6886;--c-navy:#15192B;--shadow:0 8px 24px rgba(21,25,43,.08)}
.app.dark{--grad-primary:linear-gradient(135deg,#3D63F0 0%,#5B4BE0 60%,#7A5CF0 100%);--grad-chrome:linear-gradient(115deg,#05070F 0%,#0E1640 55%,#1E1850 100%);--grad-soft:linear-gradient(135deg,rgba(111,147,255,.16) 0%,rgba(60,205,184,.10) 100%);--grad-ink:linear-gradient(135deg,#2A3366 0%,#3D2F7A 100%);--page-bg:radial-gradient(900px 420px at 8% -8%,rgba(61,99,240,.18),transparent 70%),radial-gradient(800px 380px at 100% 0%,rgba(122,92,240,.14),transparent 70%),#0E111C;--c-blue:#6F93FF;--c-teal:#3CCDB8;--c-violet:#A48DFF;--c-amber:#F2B44B;--c-coral:#FF8A73;--c-rose:#F27AAE;--c-slate:#9AA6C4;--c-navy:#C9D2EA;--shadow:0 8px 28px rgba(0,0,0,.45)}
.app input{background:var(--surface);color:var(--ink)}
.app section{animation:rr-rise .5s cubic-bezier(.2,.7,.2,1) both;transition:box-shadow .25s ease,border-color .25s ease}
.app section:hover{box-shadow:var(--shadow)}
.app button{transition:background-color .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease,transform .12s ease,filter .18s ease}
.app button:hover:not(:disabled){filter:brightness(1.06)}
.app button:active:not(:disabled){transform:translateY(1px)}
.app tbody tr{transition:background-color .18s ease}
.app tbody tr:hover{background:var(--surface-2)}
.kpi{position:relative;overflow:hidden;animation:rr-rise .5s cubic-bezier(.2,.7,.2,1) both;transition:transform .2s ease,box-shadow .2s ease}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi:nth-child(2){animation-delay:.06s}.kpi:nth-child(3){animation-delay:.12s}.kpi:nth-child(4){animation-delay:.18s}
.heat-cell{transition:transform .15s ease,box-shadow .15s ease}
.heat-cell:hover{transform:scale(1.08);box-shadow:0 2px 10px rgba(31,79,209,.35)}
.bar-fill{transform-origin:left center;animation:rr-grow .9s cubic-bezier(.2,.7,.2,1) both}
.live-dot{position:relative;display:inline-block;width:8px;height:8px;border-radius:999px;background:var(--c-teal)}
.live-dot::after{content:"";position:absolute;inset:-4px;border-radius:999px;border:2px solid var(--c-teal);animation:rr-pulse 1.8s ease-out infinite}
.overlay{animation:rr-fade .2s ease-out both}
.dialog{animation:rr-pop .25s cubic-bezier(.2,.7,.2,1) both}
.stripe{height:3px;display:flex}.stripe span{flex:1}
@keyframes rr-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes rr-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rr-pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.6);opacity:0}}
@keyframes rr-fade{from{opacity:0}to{opacity:1}}
@keyframes rr-pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.app *,.app *::after{animation:none!important;transition:none!important}}
.app input::placeholder{color:var(--muted)}
.app button:focus-visible,.app a:focus-visible,.app input:focus-visible{outline:2px solid #93ADFF;outline-offset:2px}
a{color:var(--link)}a:hover{color:var(--accent-ink)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 12px;font-size:14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/plain" id="dc-template"><div class="{{appCls}}" style="min-height: 100vh; background: var(--page-bg); font-family: 'IBM Plex Sans', sans-serif; color: var(--ink)">

<header style="background: var(--grad-chrome); color: #FFFFFF">
<div style="max-width: 1360px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px">
<svg width="44" height="44" viewBox="0 0 48 48" role="img" aria-label="Capability Radar logo">
<defs><linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E62F5"></stop><stop offset="1" stop-color="#6A4BD6"></stop></linearGradient></defs>
<circle cx="24" cy="24" r="22" fill="url(#logo-g)"></circle>
<circle cx="24" cy="24" r="15" fill="none" stroke="#9DB4FF" stroke-width="1.2" stroke-dasharray="2 2.5"></circle>
<circle cx="24" cy="24" r="8" fill="none" stroke="#9DB4FF" stroke-width="1.2" stroke-dasharray="2 2.5"></circle>
<path d="M24 24L24 2A22 22 0 0 1 39.6 8.4Z" fill="#3DDC97" fill-opacity="0.35"></path>
<line x1="24" y1="24" x2="39.6" y2="8.4" stroke="#3DDC97" stroke-width="1.6" stroke-linecap="round"></line>
<circle cx="31" cy="12.5" r="2.6" fill="#3DDC97"></circle>
<circle cx="14" cy="30" r="2.2" fill="#FFC145"></circle>
<circle cx="35" cy="31" r="2" fill="#FF6B5B"></circle>
<circle cx="24" cy="24" r="2.4" fill="#FFFFFF"></circle>
</svg>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-family: 'IBM Plex Serif', serif; font-size: 24px; font-weight: 600; line-height: 1.1">Capability Radar</div>
<div style="font-size: 13px; color: #C9CEDB">Concept prototype · sample data only</div>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<div role="group" aria-label="View as" style="display: flex; flex-wrap: wrap; gap: 6px; background: #262B40; padding: 4px; border-radius: 10px">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="3">
<button type="button" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="{{r.style}}">{{r.label}}</button>
</sc-for>
</div>
<button type="button" onClick="{{toggleTheme}}" aria-pressed="{{darkPressed}}" aria-label="Dark mode" style="font: inherit; font-size: 14px; font-weight: 600; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #3F4763; background: #262B40; color: #FFFFFF; cursor: pointer; display: inline-flex; align-items: center; gap: 8px">
<sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
</sc-if>
<sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
</sc-if>
<span>{{themeLabel}}</span>
</button>
</div>
</div>
<div aria-hidden="true" style="height: 3px; background: linear-gradient(90deg,#1F4FD1 0%,#0E8F80 25%,#6A4BD6 50%,#C27C0E 75%,#D2533F 100%)"></div>
</header>

<div style="max-width: 1360px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13px; color: var(--muted)">
<span style="background: var(--surface); border: 1px solid var(--line); padding: 6px 10px; border-radius: 999px">Signed in as: <strong style="color: var(--ink)">{{roleName}}</strong></span>
<span>{{roleScope}}</span>
</div>

<!-- ================= EXECUTIVE: TOP ================= -->
<sc-if value="{{isExec}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 20px">

<section style="background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline">
<h2 style="margin: 0; font-family: 'IBM Plex Serif', serif; font-size: 22px; font-weight: 600">Good morning. Here's what changed in the last 24 hours.</h2>
<span style="font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 8px"><span class="live-dot" aria-hidden="true"></span>Live daily brief · Mon, Oct 19</span>
</div>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 1.5">
<li>2 new projects entered intake. <strong>1 overlaps</strong> an existing savings tool in Immunology.</li>
<li>3 sites launched (Oncology ×2, Aesthetics ×1). All use the shared sign-up component.</li>
<li>1 label update affects <strong>9 live pages</strong> across 3 sites. Owners have been notified.</li>
</ul>
</section>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<sc-for list="{{kpis}}" as="k" hint-placeholder-count="4">
<div class="kpi" style="background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 4px">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 4px; background: {{k.grad}}"></div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<div style="font-size: 13px; color: var(--muted)">{{k.label}}</div>
<span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; background: {{k.grad}}; color: #FFFFFF; font-size: 15px; font-weight: 700">{{k.icon}}</span>
</div>
<div style="font-size: 32px; font-weight: 600; color: var(--ink)">{{k.value}}</div>
<div style="font-size: 13px; color: {{k.noteColor}}">{{k.note}}</div>
</div>
</sc-for>
</div>

<section style="background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">Portfolio heatmap: how many of each feature exist</h2>
<span style="font-size: 13px; color: var(--muted)">Tap a portfolio or any number to open it in the radar below.</span>
</div>
<div style="overflow-x: auto">
<table>
<thead>
<tr>
<th>Portfolio</th>
<sc-for list="{{capNames}}" as="c" hint-placeholder-count="6"><th style="text-align: center">{{c}}</th></sc-for>
<th style="text-align: center">Live sites</th>
</tr>
</thead>
<tbody>
<sc-for list="{{heat}}" as="row" hint-placeholder-count="5">
<tr style="{{row.rowStyle}}">
<td><button type="button" onClick="{{row.pick}}" style="background: none; border: 0; padding: 6px 0; font: inherit; font-weight: 600; color: var(--link); cursor: pointer; min-height: 44px; text-align: left">{{row.name}}</button></td>
<sc-for list="{{row.cells}}" as="cell" hint-placeholder-count="6">
<td style="text-align: center; padding: 6px"><button type="button" class="heat-cell" onClick="{{cell.pick}}" aria-label="{{cell.aria}}" style="{{cell.style}}">{{cell.n}}</button></td>
</sc-for>
<td style="text-align: center; font-weight: 600">{{row.sites}}</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
</section>
</div>
</sc-if>

<!-- ================= PRODUCT OWNER: TOP ================= -->
<sc-if value="{{isPO}}" hint-placeholder-val="{{ false }}">
<section style="background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'IBM Plex Serif', serif; font-size: 22px; font-weight: 600">Before you build: does it already exist?</h2>
<label for="find" style="font-size: 13px; color: var(--muted)">Search features across every site</label>
<input id="find" type="search" value="sign-up form" style="font: inherit; font-size: 15px; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 10px; min-height: 44px">
<div style="font-size: 14px; color: var(--muted)"><strong style="color: var(--ink)">{{signupLine}}</strong> Best ones to reuse:</div>
<div style="overflow-x: auto">
<table>
<thead><tr><th>Feature</th><th>Where it runs</th><th>Platform</th><th>Owner to contact</th><th>Reuse</th></tr></thead>
<tbody>
<sc-for list="{{found}}" as="f" hint-placeholder-count="4">
<tr><td style="font-weight: 600">{{f.name}}</td><td>{{f.where}}</td><td>{{f.platform}}</td><td><a href="#radar">{{f.owner}}</a></td><td><span style="{{f.tag}}">{{f.reuse}}</span></td></tr>
</sc-for>
</tbody>
</table>
</div>
</section>
</sc-if>

<!-- ================= RADAR EXPLORER (exec + PO) ================= -->
<sc-if value="{{showExplorer}}" hint-placeholder-val="{{ true }}">
<section id="radar" style="background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-family: 'IBM Plex Serif', serif; font-size: 22px; font-weight: 600">Radar explorer</h2>
<div style="font-size: 14px; color: var(--muted)">Drill from any portfolio down to the person to call.</div>
</div>
<div role="group" aria-label="Start from" style="display: flex; flex-wrap: wrap; gap: 4px; background: var(--chip); padding: 4px; border-radius: 10px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<button type="button" onClick="{{m.pick}}" aria-pressed="{{m.pressed}}" style="{{m.style}}">{{m.label}}</button>
</sc-for>
</div>
</div>

<sc-if value="{{isCols}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 14px">
<nav aria-label="Drill-down path" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px">
<sc-for list="{{crumbs}}" as="c" hint-placeholder-count="5">
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em">{{c.level}}</span><span style="font-weight: 600; background: var(--accent-soft); color: var(--accent-ink); padding: 4px 10px; border-radius: 999px">{{c.value}}</span><sc-if value="{{c.more}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="color: #9AA0AE">›</span></sc-if></span>
</sc-for>
</nav>

<div style="display: flex; overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2)">
<sc-for list="{{columns}}" as="col" hint-placeholder-count="4">
<div style="flex: 0 0 236px; border-right: 1px solid var(--line); display: flex; flex-direction: column">
<div style="padding: 12px 14px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<span style="font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em">{{col.step}} · {{col.title}}</span>
<span style="font-size: 12px; color: var(--muted)">{{col.count}}</span>
</div>
<div style="padding: 0 8px 10px; display: flex; flex-direction: column; gap: 4px; max-height: 440px; overflow-y: auto">
<sc-for list="{{col.items}}" as="it" hint-placeholder-count="4">
<button type="button" onClick="{{it.pick}}" aria-pressed="{{it.pressed}}" style="{{it.style}}">
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-weight: 600; font-size: 14px">{{it.label}}</span>
<span style="{{it.subStyle}}">{{it.sub}}</span>
</span>
<span aria-hidden="true" style="font-size: 18px">›</span>
</button>
</sc-for>
</div>
</div>
</sc-for>

<div style="flex: 1 0 320px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; background: var(--surface); border-radius: 0 12px 12px 0">
<span style="font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em">{{contactStep}} · Point of contact</span>
<div style="display: flex; align-items: center; gap: 12px">
<div aria-hidden="true" style="width: 48px; height: 48px; border-radius: 999px; background: var(--grad-ink); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600">{{person.initials}}</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-family: 'IBM Plex Serif', serif; font-size: 20px; font-weight: 600">{{person.name}}</div>
<div style="font-size: 14px; color: var(--muted)">{{person.role}} · {{person.team}}</div>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" style="font: inherit; font-size: 14px; font-weight: 600; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 0; background: var(--grad-primary); color: #FFFFFF; cursor: pointer">Message in Teams</button>
<button type="button" style="font: inherit; font-size: 14px; font-weight: 600; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer">Book 15 min</button>
</div>
<div style="border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 14px">
<div style="font-weight: 600">Responsible for</div>
<div style="line-height: 1.5">{{person.resp}}, for {{inst.featName}} on {{inst.siteName}}.</div>
<sc-for list="{{facts}}" as="f" hint-placeholder-count="6">
<div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: var(--muted)">{{f.k}}</span><span style="font-weight: 600; text-align: right">{{f.v}}</span></div>
</sc-for>
</div>
<div style="border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 14px; font-weight: 600">Where it's documented and live</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{srcButtons}}" as="s" hint-placeholder-count="3">
<button type="button" onClick="{{s.pick}}" aria-haspopup="dialog" style="font: inherit; font-size: 14px; font-weight: 600; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px"><span style="{{s.dot}}" aria-hidden="true"></span>{{s.label}}<span style="font-size: 12px; font-weight: 600; background: var(--chip); color: var(--ink-2); padding: 2px 8px; border-radius: 999px">{{s.count}}</span></button>
</sc-for>
</div>
<div style="font-size: 13px; color: var(--muted)">Radar pulls these in read-only. They feed the radar; they are not the source of truth.</div>
</div>
<sc-if value="{{isExec}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; background: #FCEBE4; border-radius: 8px; padding: 10px 12px; font-size: 14px; color: #8A2E0E">
<span>Annual run cost: <strong>$[ADD FIGURE]</strong></span><span style="font-size: 12px; font-weight: 600">Executives only</span>
</div>
</sc-if>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{isAI}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch">
<label for="aiq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ask the radar a question</label>

    const legacy = !inst.shared;
    const liveItems = [
      { title: 'Production: ' + fName, path: 'https://www.' + host + '/' + slug, meta: 'Live since ' + (legacy ? 'Mar 2023' : 'Jun 2025') + ' · ' + inst.verified, tag: 'Production', tagStyle: tGreen },
      { title: 'Production: confirmation page', path: 'https://www.' + host + '/' + slug + '/thank-you', meta: 'Shown after a successful submission', tag: 'Production', tagStyle: tGreen },
      { title: 'Stage / UAT', path: 'https://stage.' + host + '/' + slug, meta: inFlight ? 'Next release under test · owner ' + T.qa : 'Matches production · owner ' + T.ops, tag: 'Stage', tagStyle: tAmber },
      { title: 'AEM author page', path: 'author › /content/' + site.name.split(' · ')[0].toLowerCase().replace(' ', '-') + '/en/' + slug, meta: 'Editable by content authors · owner ' + T.aem, tag: 'Author', tagStyle: tGrey }
    ];
    sites.filter((s) => s.id !== site.id && s.keys.indexOf(feat) >= 0).slice(0, 3).forEach((s) => {
      liveItems.push({ title: 'Also live on ' + s.name, path: 'https://www.' + hostOf(s) + '/' + slug, meta: s.port + ' · ' + s.inst[feat].impl, tag: 'Same feature', tagStyle: tGrey });
    });
    SRC.live = { label: 'Live links', app: 'a new browser tab', dot: '#15192B', items: liveItems };
    const srcKey = SRC[st.src] ? st.src : null;
    const dotStyle = (c) => 'display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: ' + c;
    const srcButtons = ['confluence', 'smartsheet', 'jira', 'live'].map((k) => ({
      label: SRC[k].label, count: SRC[k].items.length + '', dot: dotStyle(SRC[k].dot),
      pressed: k === srcKey ? 'true' : 'false',
      tabStyle: 'font: inherit; font-size: 14px; font-weight: 600; min-height: 40px; padding: 0 14px; border-radius: 8px; cursor: pointer; ' +
        (k === srcKey ? 'background: var(--grad-ink); color: #FFFFFF; border: 1px solid transparent' : 'background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong)'),
      pick: () => this.setState({ src: k, port, site: site.id, feat, person: pKey })
    }));
    const modalOpen = !!srcKey && (isExec || isPO);
    const modal = srcKey ? {
      title: SRC[srcKey].label + ' links',
      app: SRC[srcKey].app,
      dot: dotStyle(SRC[srcKey].dot),
      context: fName + ' on ' + inst.siteName + ' · ' + inst.port,
      items: SRC[srcKey].items
    } : { title: '', app: '', dot: '', context: '', items: [] };
    const closeModal = () => this.setState({ src: null, port, site: site.id, feat, person: pKey });

    const colP = { title: 'Portfolio', items: portItems, count: portItems.length + '' };
    const colS = { title: 'Site', items: siteItems, count: siteItems.length + '' };
    const colF = { title: 'Feature', items: featItems, count: featItems.length + '' };
    const colT = { title: 'Team', items: teamItems, count: teamItems.length + ' teams' };
    let columns = mode === 'portfolio' ? [colP, colS, colF, colT] : [colF, colP, colS, colT];
    columns = columns.map((c, idx) => ({ ...c, step: (idx + 1) + '' }));

    const crumbVals = mode === 'portfolio'
      ? [['Portfolio', port], ['Site', site.name], ['Feature', featBy[feat].name], ['Team', tm.team], ['Contact', person.name]]
      : [['Feature', featBy[feat].name], ['Portfolio', port], ['Site', site.name], ['Team', tm.team], ['Contact', person.name]];
    const crumbs = crumbVals.map((c, idx) => ({ level: c[0], value: c[1], more: idx < crumbVals.length - 1 }));

    const facts = [
      { k: 'Role (RACI)', v: tm.raci },
      { k: 'Stage', v: tm.stage },
      { k: 'Staffed by', v: tm.staffedBy },
      { k: 'Team status', v: tm.status },
      { k: 'Implementation', v: inst.impl },
      { k: 'Reusable', v: inst.shared ? 'Yes · shared component' : 'No · custom build' },
      { k: 'Platform', v: inst.platform },
      { k: 'Feature status', v: inst.status },
      { k: 'Last verified', v: inst.verified }
    ];

    const modeTab = (on) => 'font: inherit; font-size: 14px; font-weight: 600; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 0; cursor: pointer; ' +
      (on ? 'background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(21,25,43,.12)' : 'background: transparent; color: var(--ink-2)');
    const modes = [['portfolio', 'Start from portfolio'], ['feature', 'Start from feature'], ['ai', '✦ Ask AI']].map(([id, label]) => ({
      label, pressed: id === mode ? 'true' : 'false', style: modeTab(id === mode),
      pick: () => id === 'ai' ? this.setState({ mode: id }) : this.setState({ mode: id, site: null, person: 'po', feat: id === 'feature' ? (st.feat || 'signup') : null })
    }));

    // ---------- AI mode (prototype: keyword understanding over the radar data) ----------
    const isAI = mode === 'ai';
    const qText = st.q === undefined ? 'Who owns sign-up forms in Oncology?' : st.q;
    const asked = st.asked === undefined ? 'Who owns sign-up forms in Oncology?' : st.asked;
    const ask = (text) => this.setState({ q: text, asked: text });
    const ql = ' ' + asked.toLowerCase().replace(/[^a-z0-9\s-]/g, ' ') + ' ';
    const has = (words) => words.some((w) => ql.indexOf(' ' + w) >= 0);
    const FEAT_WORDS = {
      signup: ['sign-up', 'signup', 'sign up', 'registration', 'enroll', 'form'],
      savings: ['saving', 'savings', 'card'],
      hcp: ['hcp portal', 'portal', 'provider', 'login'],
      copay: ['copay', 'co-pay', 'calculator'],
      chat: ['chat', 'assistant', 'bot', 'ai assistant'],
      finder: ['finder', 'doctor', 'locator']
    };
    const TEAM_WORDS = {
      ui: ['ui', 'front-end', 'frontend', 'front end', 'styling', 'design'],
      aem: ['aem', 'component'],
      api: ['api', 'backend', 'back-end', 'integration'],
      qa: ['qa', 'test', 'testing', 'tested'],
      ops: ['ops', 'operations', 'platform', 'environment', 'config'],
      mlr: ['mlr', 'regulatory', 'legal'],
      po: ['owner', 'owns', 'product owner', 'accountable']
    };
    const qFeats = Object.keys(FEAT_WORDS).filter((k) => has(FEAT_WORDS[k]));
    const qPorts = PORTS.map((p) => p.name).filter((n) => has([n.toLowerCase()]) || (n === 'Eye care' && has(['eye'])));
    const bm = ql.match(/ brand ([a-o]) /);
    const qBrand = bm ? 'Brand ' + bm[1].toUpperCase() : null;
    const allPocs = {};
    allInst.forEach((x) => x.teams.forEach((tt) => { allPocs[tt.poc] = true; }));
    const qPerson = Object.keys(allPocs).find((n) => n && ql.indexOf(' ' + n.toLowerCase() + ' ') >= 0) ||
      Object.keys(allPocs).find((n) => n && n.split(' ')[0].length > 2 && ql.indexOf(' ' + n.split(' ')[0].toLowerCase() + ' ') >= 0) || null;
    const qTeams = Object.keys(TEAM_WORDS).filter((k) => k !== 'po' && has(TEAM_WORDS[k]));
    const qLegacy = has(['legacy', 'custom', 'migrate']);
    const qFlight = has(['in flight', 'in progress', 'inflight', 'update', 'open']);
    const understood = [];
    if (qFeats.length) understood.push(qFeats.map((k) => featBy[k].name).join(', '));
    if (qPorts.length) understood.push(qPorts.join(', '));
    if (qBrand) understood.push(qBrand);
    if (qPerson) understood.push(qPerson);
    if (qTeams.length) understood.push(qTeams.map((k) => inst.teams.find((x) => x.key === k).team).join(', '));
    if (qLegacy) understood.push('Legacy builds');
    if (qFlight) understood.push('In flight');

    let hits = [];
    sites.forEach((s) => s.keys.forEach((k) => {
      const x = s.inst[k];
      if (qFeats.length && qFeats.indexOf(k) < 0) return;
      if (qPorts.length && qPorts.indexOf(s.port) < 0) return;
      if (qBrand && s.name.indexOf(qBrand + ' ') !== 0) return;
      if (qPerson && !x.teams.some((tt) => tt.poc === qPerson)) return;
      if (qLegacy && x.shared) return;
      if (qFlight && x.status !== 'Update in flight') return;
      hits.push({ s, k, x });
    }));
    const filtered = understood.length > 0;
    if (!filtered) hits = [];

    const chip = (on) => 'display: inline-flex; flex-direction: column; gap: 1px; font-size: 13px; padding: 6px 10px; border-radius: 8px; ' +
      (on ? 'background: var(--grad-primary); color: #FFFFFF' : 'background: var(--bg); color: var(--ink); border: 1px solid var(--line)');
    const aiPorts = [];
    hits.forEach((h) => {
      let pn = aiPorts.find((p) => p.name === h.s.port);
      if (!pn) { pn = { name: h.s.port, sites: [], n: 0 }; aiPorts.push(pn); }
      let sn = pn.sites.find((x) => x.id === h.s.id);
      if (!sn) { sn = { id: h.s.id, name: h.s.name, owner: h.s.owner, feats: [] }; pn.sites.push(sn); }
      pn.n++;
      const teamsShown = h.x.teams.filter((tt) => !qTeams.length || qTeams.indexOf(tt.key) >= 0 || tt.key === 'po');
      sn.feats.push({
        name: h.x.featName, impl: h.x.impl, status: h.x.status, statusStyle: statusPill(h.x.status === 'Live' ? 'Done' : h.x.status),
        teams: teamsShown.map((tt) => {
          const on = (qPerson && tt.poc === qPerson) || (qTeams.indexOf(tt.key) >= 0);
          return { team: tt.team, poc: tt.poc, style: chip(on), subStyle: 'font-weight: 600' };
        }),
        open: () => this.setState({ mode: 'portfolio', port: h.s.port, site: h.s.id, feat: h.k, person: qPerson ? (h.x.teams.find((tt) => tt.poc === qPerson) || {}).key || 'po' : (qTeams[0] || 'po'), src: null })
      });
    });
    aiPorts.forEach((p) => { p.summary = p.n + ' match' + (p.n === 1 ? '' : 'es') + ' · ' + p.sites.length + ' site' + (p.sites.length === 1 ? '' : 's'); });

    let aiAnswer;
    if (!filtered) {
      aiAnswer = "I couldn't match that to a feature, portfolio, brand, team or person yet. Try one of the suggestions below.";
    } else if (!hits.length) {
      aiAnswer = 'No matches for ' + understood.join(' + ') + '. Nothing like that is live right now, so this could be a new build. Check with the feature owner before starting.';
    } else {
      const nSites = new Set(hits.map((h) => h.s.id)).size;
      const legacyN = hits.filter((h) => !h.x.shared).length;
      const label = qFeats.length === 1 ? featBy[qFeats[0]].name.toLowerCase() + (hits.length === 1 ? '' : 's') : 'feature instance' + (hits.length === 1 ? '' : 's');
      aiAnswer = 'Found ' + hits.length + ' ' + label + ' across ' + aiPorts.length + ' portfolio' + (aiPorts.length === 1 ? '' : 's') + ' and ' + nSites + ' site' + (nSites === 1 ? '' : 's') + '.';
      if (qFeats.length === 1) aiAnswer += ' Accountable product owner: ' + featBy[qFeats[0]].lead + '.';
      if (qPerson) {
        const roleSet = {};
        hits.forEach((h) => h.x.teams.forEach((tt) => { if (tt.poc === qPerson) roleSet[tt.team] = true; }));
        aiAnswer += ' ' + qPerson + ' is involved as ' + Object.keys(roleSet).join(', ') + '.';
      }
      if (qTeams.length) {
        const pocSet = {};
        hits.forEach((h) => h.x.teams.forEach((tt) => { if (qTeams.indexOf(tt.key) >= 0) pocSet[tt.poc] = true; }));
        aiAnswer += ' Points of contact for that team: ' + Object.keys(pocSet).join(', ') + '.';
      }
      if (legacyN && !qLegacy) aiAnswer += ' ' + legacyN + ' of them are legacy custom builds worth migrating.';
    }
    const suggestions = [
      'Who owns sign-up forms in Oncology?',
      'Who does QA for doctor finder?',
      'Where is Arjun Rao involved?',
      'Show legacy savings programs',
      'What is in flight on Brand A?'
    ].map((s) => ({ text: s, pick: () => ask(s) }));
    const ai = {
      q: qText,
      onQ: (e) => this.setState({ q: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') ask(e.target.value); },
      submit: () => ask(qText),
      answer: aiAnswer,
      understood: understood.map((u) => ({ text: u })),
      hasUnderstood: understood.length > 0,
      ports: aiPorts,
      suggestions
    };

    // ---------- other panels ----------
    const kpis = [
      { label: 'Live sites', value: sites.length + '', note: '+3 this week', noteColor: 'var(--good)', grad: 'linear-gradient(135deg,#0E8F80,#3CCDB8)', accent: 'var(--c-teal)', tint: 'rgba(14,143,128,.12)', icon: '◉' },
      { label: 'Feature instances tracked', value: allInst.length + '', note: FEATS.length + ' feature types · 5 portfolios', noteColor: 'var(--muted)', grad: 'linear-gradient(135deg,#1F4FD1,#6F93FF)', accent: 'var(--c-blue)', tint: 'rgba(31,79,209,.12)', icon: '▦' },
      { label: 'Duplicate builds in flight', value: '4', note: '1 new since yesterday', noteColor: 'var(--bad)', grad: 'linear-gradient(135deg,#D2533F,#F2B44B)', accent: 'var(--c-coral)', tint: 'rgba(210,83,63,.12)', icon: '⧉' },
      { label: 'Shared-component reuse', value: sharedPct + '%', note: 'Target: 90% by Q4', noteColor: 'var(--muted)', grad: 'linear-gradient(135deg,#6A4BD6,#C2417A)', accent: 'var(--c-violet)', tint: 'rgba(106,75,214,.12)', icon: '↻' }
    ];
    const decisions = [
      { title: 'Move ' + customSignups + ' custom sign-up forms onto the shared component', detail: signups.length + ' sign-up forms are live. ' + customSignups + ' are custom builds on separate stacks, each needing its own MLR review and maintenance.', rec: 'Recommend: approve', impact: 'Est. savings: $[ADD FIGURE]' },
      { title: 'Two teams starting savings tools this quarter', detail: 'Neuroscience (Brand G) and Eye care (Brand J) both plan new builds. The shared savings card block covers both.', rec: 'Recommend: merge', impact: 'Avoids 1 duplicate build' },
      { title: 'Vendor renewal: overlapping contracts', detail: 'Vendor A and Vendor B maintain near-identical sites across four portfolios.', rec: 'Recommend: review at QBR', impact: 'Leverage for rate negotiation' }
    ];
    const vendors = [['Vendor A', 38, 'linear-gradient(90deg,#1F4FD1,#6F93FF)'], ['Vendor B', 27, 'linear-gradient(90deg,#0E8F80,#3CCDB8)'], ['Vendor C', 21, 'linear-gradient(90deg,#6A4BD6,#C2417A)'], ['Other', 14, 'linear-gradient(90deg,#5B6886,#9AA6C4)']].map(([name, w, c], i) => ({
      name, pct: w + '%', bar: 'height: 10px; border-radius: 999px; background: ' + c + '; width: ' + w + '%; animation-delay: ' + (i * 0.1) + 's'
    }));

    const tagOk = 'font-size: 13px; font-weight: 600; color: #1E6B45; background: #E6F2EB; padding: 4px 10px; border-radius: 999px; white-space: nowrap';
    const tagWarn = 'font-size: 13px; font-weight: 600; color: #8A2E0E; background: #FCEBE4; padding: 4px 10px; border-radius: 999px; white-space: nowrap';
    const sharedSignupSites = signups.filter((x) => x.shared).length;
    const found = [
      { name: 'Shared sign-up v2', where: sharedSignupSites + ' sites, all portfolios', platform: 'AEM + SFMC', owner: 'Maya Patel · Forms squad', reuse: 'Ready to reuse', tag: tagOk },
      { name: 'Custom form (legacy)', where: customSignups + ' sites', platform: 'Custom React', owner: 'Site product owners', reuse: 'Migrate', tag: tagWarn }
    ];
    const signupLine = signups.length + ' sign-up forms found on ' + signups.length + ' sites.';
    const flagWarn = 'font-size: 14px; line-height: 1.5; color: #8A2E0E; background: #FCEBE4; padding: 8px 12px; border-radius: 8px';
    const flagOk = 'font-size: 14px; line-height: 1.5; color: #1E6B45; background: #E6F2EB; padding: 8px 12px; border-radius: 8px';
    const myProjects = [
      { name: 'Brand G savings program', stage: 'Intake', flag: 'Overlap: the shared savings card block already does this. Talk to Jordan Reyes before scoping.', flagStyle: flagWarn },
      { name: 'Brand H HCP portal refresh', stage: 'Design', flag: 'Reusing HCP portal template v3. No overlap found.', flagStyle: flagOk },
      { name: 'Brand I doctor finder', stage: 'Build', flag: 'Locator service v1 is live on 5 sites. Consider reusing it (Noah Grant).', flagStyle: flagWarn }
    ];
    const contacts = FEATS.map((f) => ({ topic: f.name, who: f.lead + ' · ' + f.team }));

    const workOrders = [
      { id: 'WO-1042', title: 'Hero and ISI update', site: 'Brand D · patient site', due: 'Oct 24', status: 'In progress', contact: 'Marcus Hill' },
      { id: 'WO-1047', title: 'Migrate form to shared sign-up v2', site: 'Brand E · patient site', due: 'Nov 7', status: 'Not started', contact: 'Maya Patel' },
      { id: 'WO-1051', title: 'Accessibility fixes (WCAG 2.2 AA)', site: 'Brand F · HCP site', due: 'Nov 14', status: 'Not started', contact: 'Tom Becker' }
    ];
    const components = [
      { name: 'Sign-up form', ver: 'v2.3 · AEM + SFMC' },
      { name: 'ISI module', ver: 'v4.0 · auto-synced to label' },
      { name: 'Savings card block', ver: 'v1.8' },
      { name: 'Consent banner', ver: 'v3.1' }
    ];

    const Y = 'Yes', N = '—';
    const matrix = [
      { item: 'Daily brief, KPIs and portfolio heatmap', exec: Y, po: N, vendor: N },
      { item: 'Radar explorer (portfolio → site → feature → team → contact)', exec: Y, po: Y, vendor: N },
      { item: 'Stakeholder map (teams, POCs, responsibilities)', exec: Y, po: Y, vendor: N },
      { item: 'Decisions queue', exec: Y, po: N, vendor: N },
      { item: 'Budgets, run costs and vendor spend', exec: Y, po: N, vendor: N },
      { item: 'Feature search and owners', exec: Y, po: Y, vendor: 'Own sites only' },
      { item: 'Projects in flight and overlap alerts', exec: Y, po: Y, vendor: N },
      { item: 'Work orders and component standards', exec: Y, po: Y, vendor: 'Own work only' }
    ];

    return {
      appCls: st.dark ? 'app dark' : 'app',
      isDark: !!st.dark, isLight: !st.dark, darkPressed: st.dark ? 'true' : 'false',
      themeLabel: st.dark ? 'Light mode' : 'Dark mode',
      toggleTheme: () => {
        const next = !this.state.dark;
        try { window.localStorage.setItem('radar-theme', next ? 'dark' : 'light'); } catch (e) {}
        this.setState({ dark: next });
      },
      roles, roleName: names[role], roleScope: scopes[role],
      isCols: mode === 'portfolio' || mode === 'feature',
      isExec, isPO, isVendor, showExplorer: isExec || isPO,
      capNames: FEATS.map((f) => f.name), heat, kpis, decisions, vendors,
      modes, crumbs, columns, contactStep: '5', person, inst, facts,
      srcButtons, modalOpen, modal, closeModal, isAI, notAI: !isAI, ai,
      stakeRows, stakeSummary, stakeTitle: featBy[feat].name + ' on ' + site.name,
      found, signupLine, myProjects, contacts,
      workOrders, components, matrix
    };
  }
}

window.__mountDC(Component, document.getElementById('dc-template').textContent, document.getElementById('app'));
</script>
</body>
</html>
